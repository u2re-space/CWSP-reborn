<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          window.__CWS_BOOT_SMOKE__ = Date.now();
          console.log('[cwsp-neutralino] inline-smoke ok', location.href, 'NL_PORT=' + (typeof NL_PORT !== 'undefined' ? NL_PORT : '?'));
          window.addEventListener('error', function (ev) {
            try {
              console.error('[cwsp-neutralino] window.error', ev && (ev.message || ev.error));
              var el = document.getElementById('cwsp-boot-fallback');
              if (el) el.innerHTML = 'CWSP boot error: ' + String((ev && ev.message) || 'unknown');
            } catch (_) {}
          });
          window.addEventListener('unhandledrejection', function (ev) {
            try { console.error('[cwsp-neutralino] unhandledrejection', ev && ev.reason); } catch (_) {}
          });
        } catch (e) {
          try { document.title = 'CWSP smoke fail'; } catch (_) {}
        }
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>CWSP Neutralino</title>
    <!--
      WHY: tray/close-to-tray is resources/js/cwsp-window-chrome.js
      (injected by scripts/build-neutralino.mjs after Neutralino.init).
      INVARIANT: modes.window.exitProcessOnClose must be false or hide() never runs.
      INVARIANT: tray is always-on from boot — not only after Close.
      NOTE: do NOT make this document transparent/fullscreen — that belonged to the
      independent clipboard-prompt toast (resources/clipboard-prompt/), not the main shell.
      A mistaken transparent main index + invalid --mode=popup produced a maximized
      clear taskbar window that looked like a broken toast.
    -->
    <script>
      window.CWSP_ICON = "/resources/icons/appIcon.png";
      window.__CWS_BOOT_SMOKE__ = Date.now();
      console.log("[cwsp-neutralino] source-html smoke", location.href);
    </script>
    
    <link rel="stylesheet" href="./assets/style-CPA2VslW.css">
      <script src="/js/neutralino.js"></script>
    <script src="/js/cwsp-window-chrome.js"></script>
</head>
  <body>
    <div id="cwsp-boot-fallback" style="font:14px/1.4 system-ui,sans-serif;padding:24px;color:#e8e8ea;background:#121214;min-height:100vh;box-sizing:border-box">
      CWSP Neutralino starting…
      <div style="opacity:.7;margin-top:8px;font-size:12px">If this stays forever, open DevTools (F12) and check module load errors.</div>
    </div>

    <!-- WHY: static Neutralino shell boots minimal+network+settings (AirPad disabled). -->
    <!-- Neutralino.js + init + tray are injected post-Vite by scripts/build-neutralino.mjs -->
    <script type="module" src="./assets/cwsp-app.js"></script>
  </body>
</html>
